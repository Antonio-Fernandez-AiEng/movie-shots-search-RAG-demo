services:
  video-rag:
    build: .
    container_name: shotlist_rag_search
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data/extracted_shots:/app/data/extracted_shots
      - ./databases/chroma_db:/app/databases/chroma_db
      - ./tests:/app/tests    
    environment:
      - PYTHONUNBUFFERED=1