<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmmaker Shotlist RAG — Recruiter Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --border-color: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border-color);
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      padding: 16px 32px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      background: #0d131f;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .prompt-chip {
      background: #0d131f;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .prompt-chip:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .shot-card {
      background: #0d131f;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .shot-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .shot-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shot-title {
      font-weight: 600;
      font-size: 15px;
    }

    .score-badge {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .shot-body {
      padding: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .shot-image-container {
      width: 100%;
      height: 180px;
      background-color: #05070a;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
    }

    .shot-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .shot-card:hover .shot-image {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">🎬</div>
      <div class="logo-text">Multimodal Video RAG</div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>Demo Read-Only Mode</span>
    </div>
  </header>

  <main>
    <!-- TAB BÚSQUEDA ÚNICA -->
    <div class="card">
      <h2 style="margin-bottom: 8px; font-size: 18px;">Semantic Video Frame Search</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">
        Search through pre-indexed movie shots using natural language descriptions powered by SigLIP and ChromaDB.
      </p>
      
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Try searching for a scene (e.g., 'car wide shot', 'a man in the forest')..." onkeydown="if(event.key==='Enter') searchShots()">
        <button class="btn-primary" onclick="searchShots()">Search Scene</button>
      </div>

      <!-- Quick suggestions para reclutadores -->
      <div class="quick-prompts">
        <span>Try searching:</span>
        <button class="prompt-chip" onclick="setQueryAndSearch('cinematic portrait')">cinematic portrait</button>
        <button class="prompt-chip" onclick="setQueryAndSearch('action scene')">action scene</button>
        <button class="prompt-chip" onclick="setQueryAndSearch('night lights')">night lights</button>
      </div>
    </div>

    <div id="resultsContainer" class="results-grid"></div>
  </main>

  <script>
    // Si estás sirviendo el frontend desde el mismo FastAPI, puedes usar ruta relativa o "http://127.0.0.1:8000"
    const API_URL = "";

    function setQueryAndSearch(query) {
      document.getElementById('searchInput').value = query;
      searchShots();
    }

    // --- SEMANTIC SEARCH ---
    async function searchShots() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const container = document.getElementById('resultsContainer');
      container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Searching vector database for semantic matches...</p>';

      try {
        const response = await fetch(`${API_URL}/api/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, n_results: 6 })
        });

        const data = await response.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No matching frames found for this query.</p>';
          return;
        }

        data.results.forEach(shot => {
          const card = document.createElement('div');
          card.className = 'shot-card';

          let fileName = shot.metadata?.file_name;
          if (!fileName && shot.metadata?.file_path) {
            fileName = shot.metadata.file_path.split('/').pop().split('\\').pop();
          }

          let imageHtml = '';
          if (fileName) {
            const imageUrl = `${API_URL}/api/frames/${fileName}`;
            imageHtml = `
              <div class="shot-image-container">
                <img src="${imageUrl}" alt="Frame ${shot.id}" class="shot-image" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/320x180?text=Frame+Not+Found';">
              </div>
            `;
          } else {
            imageHtml = `
              <div class="shot-image-container" style="display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px;">
                <span>Frame not found</span>
              </div>
            `;
          }

          const timestamp = shot.metadata?.timestamp ? `${shot.metadata.timestamp}s` : 'N/A';
          const scorePercent = shot.score ? (shot.score * 100).toFixed(1) : '0.0';

          card.innerHTML = `
            ${imageHtml}
            <div class="shot-header">
              <span class="shot-title">${shot.metadata?.movie_title || 'Movie Shot'}</span>
              <span class="score-badge">${scorePercent}% Match</span>
            </div>
            <div class="shot-body">
              <p><strong>Shot ID:</strong> ${shot.id}</p>
              <p style="margin-top: 6px;"><strong>Timestamp:</strong> ${timestamp}</p>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<p style="color: var(--danger); grid-column: 1/-1; text-align: center;">Error connecting to API: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
